<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkTalk - Login & Register</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <i class="fa-solid fa-signal logo-icon"></i>
      <h2>TalkTalk Center</h2>
      <p>আপনার অ্যাকাউন্ট পরিচালনা করতে লগইন করুন</p>
    </div>

    <!-- Toggle Tabs -->
    <div class="tab-box">
      <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">লগইন</button>
      <button class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">রেজিস্ট্রেশন</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" id="loginPhone" placeholder="মোবাইল নম্বর (যেমন: 01300123456)" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="loginPin" placeholder="৪ ডিজিটের পিন কোড" maxlength="6" required>
      </div>
      <button type="submit" class="submit-btn">প্রবেশ করুন</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form hidden">
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="regName" placeholder="আপনার পূর্ণ নাম" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" id="regPhone" placeholder="TalkTalk সিম নম্বর" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="regPin" placeholder="নতুন পিন কোড সেট করুন" maxlength="6" required>
      </div>
      <button type="submit" class="submit-btn">অ্যাকাউন্ট খুলুন</button>
    </form>
  </div>

  <script src="auth.js" type="module"></script>
</body>
</html>
