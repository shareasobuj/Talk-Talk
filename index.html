<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkTalk App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff416c">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3616/3616215.png">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="top-bar">
        <div class="brand"><i class="fa-solid fa-signal"></i> TalkTalk</div>
        <div class="user-number" id="userNumber">01300-123456</div>
      </div>

      <div class="dashboard">
        <div class="card">
          <span>মেইন ব্যালেন্স</span>
          <h2 id="balanceVal">৳ 0.00</h2>
          <small>মেয়াদ: 30 Dec 2026</small>
        </div>
        <div class="card">
          <span>ইন্টারনেট</span>
          <h2 id="internetVal">0 MB</h2>
          <small>অবশিষ্ট আছে</small>
        </div>
        <div class="card">
          <span>মিনিট</span>
          <h2 id="minuteVal">0 Min</h2>
          <small>অবশিষ্ট আছে</small>
        </div>
        <div class="card">
          <span>এসএমএস</span>
          <h2 id="smsVal">0 SMS</h2>
          <small>অবশিষ্ট আছে</small>
        </div>
      </div>
    </header>

    <section class="quick-actions">
      <button class="action-btn" onclick="openModal()">
        <div class="icon-box"><i class="fa-solid fa-wallet"></i></div>
        <span>রিচার্জ</span>
      </button>
      <button class="action-btn" onclick="filterPacks('internet')">
        <div class="icon-box"><i class="fa-solid fa-wifi"></i></div>
        <span>ইন্টারনেট</span>
      </button>
      <button class="action-btn" onclick="filterPacks('minute')">
        <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
        <span>মিনিট</span>
      </button>
      <button class="action-btn" onclick="getLoan()">
        <div class="icon-box"><i class="fa-solid fa-hand-holding-dollar"></i></div>
        <span>ইমার্জেন্সি</span>
      </button>
    </section>

    <section class="section">
      <h3 class="section-title">স্পেশাল অফারসমূহ</h3>
      
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterPacks('all', this)">সব</button>
        <button class="tab-btn" onclick="filterPacks('internet', this)">ইন্টারনেট</button>
        <button class="tab-btn" onclick="filterPacks('minute', this)">মিনিট</button>
        <button class="tab-btn" onclick="filterPacks('bundle', this)">বান্ডেল</button>
      </div>

      <div class="pack-list" id="packContainer"></div>
    </section>
  </div>

  <div class="modal-overlay" id="rechargeModal">
    <div class="modal-card">
      <h3>ইনস্ট্যান্ট রিচার্জ</h3>
      <input type="number" id="rechargeAmount" placeholder="টাকার পরিমাণ লিখুন (৳)">
      <button class="btn btn-pay" onclick="processRecharge()">রিচার্জের অনুরোধ পাঠান</button>
      <button class="btn btn-close" onclick="closeModal()">বন্ধ করুন</button>
    </div>
  </div>
<script src="script.js" type="module"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <script src="offers-display.js" type="module">
    
  </script>
  
</body>
</html>
